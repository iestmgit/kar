<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تمرکزسنج</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>تمرکزسنج</h1>
    <p class="sub" id="status">آماده‌ای؟ شروع کن.</p>

    <div class="timer" id="timer">00:00</div>

    <button id="startBtn" class="btn primary">شروع</button>
    <button id="distractBtn" class="btn danger" disabled>
      حواستم پرت شد ✋
    </button>
    <button id="stopBtn" class="btn ghost" disabled>پایان</button>

    <div class="result hidden" id="result"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
